# Ventos Longes: limitadores de recursos (valores do systemd). Sobrescreva em ~/.config/ventos-longes.conf
LIMITERS="on"
MEM_HIGH="3G"      # acima disso o kernel passa a frear o navegador
MEM_MAX="4G"       # teto rígido
CPU_QUOTA="200%"   # 200% = 2 núcleos
PROFILE_DIR=""     # vazio = ~/.local/share/ventos-longes/profile
