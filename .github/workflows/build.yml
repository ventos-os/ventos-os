name: Build da imagem e ISO

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 0"   # rebuild semanal para pegar atualizações do Fedora/ublue
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ventos-os
  FEDORA_VERSION: "latest"   # fixe (ex.: "44") para builds reprodutíveis

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Verificações (scripts, Python, XML, testes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependências
        run: sudo apt-get update && sudo apt-get install -y shellcheck libxml2-utils python3-yaml
      - name: Bash (sintaxe + shellcheck)
        run: |
          for f in build_files/*.sh system_files/usr/bin/* system_files/usr/libexec/*; do
            head -n1 "$f" | grep -q python && continue
            [ "$f" = "system_files/usr/libexec/emu-common.sh" ] && continue
            bash -n "$f"
          done
          shellcheck -S error build_files/*.sh || true
      - name: Python (compilação + testes do núcleo do Modo Jogo)
        run: |
          python3 -m compileall -q system_files/usr/lib/ventos
          python3 -m unittest discover -s tests -v
      - name: XML / JSON / SVG
        run: |
          xmllint --noout system_files/usr/share/mime/packages/*.xml system_files/usr/share/icons/hicolor/scalable/apps/*.svg
          python3 -c "import json,glob; [json.load(open(f)) for f in glob.glob('system_files/**/*.json', recursive=True)]"

  build-image:
    name: Imagem (${{ matrix.variant }})
    needs: lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: amd
            suffix: ""
            base: ghcr.io/ublue-os/kinoite-main
          - variant: nvidia
            suffix: "-nvidia"
            base: ghcr.io/ublue-os/kinoite-nvidia
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Liberar espaço em disco
        uses: ublue-os/remove-unwanted-software@v9

      # As imagens do Universal Blue são grandes. O buildah padrão do runner usa o driver "vfs"
      # (copia cada camada inteira) e estoura o disco; aqui usamos podman com root (overlay)
      # e levamos o armazenamento para o disco grande do runner (/mnt).
      - name: Armazenamento do podman em /mnt
        run: |
          sudo mkdir -p /mnt/containers /var/lib/containers
          sudo mount --bind /mnt/containers /var/lib/containers
          sudo podman info --format 'driver={{.Store.GraphDriverName}} root={{.Store.GraphRoot}}'
          df -h / /mnt /var/lib/containers

      - name: Definir nome da imagem (minúsculas)
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_REF=${REGISTRY}/${OWNER}/${IMAGE_NAME}${{ matrix.suffix }}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          sudo podman build \
            --file Containerfile \
            --build-arg BASE_IMAGE=${{ matrix.base }} \
            --build-arg FEDORA_VERSION=${{ env.FEDORA_VERSION }} \
            --tag "${IMAGE_REF}:latest" \
            --tag "${IMAGE_REF}:${{ github.sha }}" \
            .

      - name: Espaço em disco após o build
        if: always()
        run: df -h / /mnt /var/lib/containers || true

      - name: Publicar no GHCR
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman push "${IMAGE_REF}:latest"
          sudo podman push "${IMAGE_REF}:${{ github.sha }}"

  build-iso:
    name: ISO (${{ matrix.variant }})
    needs: build-image
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: amd
            suffix: ""
          - variant: nvidia
            suffix: "-nvidia"
    steps:
      - name: Liberar espaço em disco
        uses: ublue-os/remove-unwanted-software@v9

      - name: Definir nome da imagem (minúsculas)
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_REF=${REGISTRY}/${OWNER}/${IMAGE_NAME}${{ matrix.suffix }}:latest" >> "$GITHUB_ENV"

      - name: Armazenamento do podman em /mnt
        run: |
          sudo mkdir -p /mnt/containers /var/lib/containers
          sudo mount --bind /mnt/containers /var/lib/containers
          df -h / /mnt

      - name: Baixar a imagem para o armazenamento do root
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull "$IMAGE_REF"

      - name: Gerar configuração do instalador
        run: |
          cat > iso.toml <<EOF
          [customizations.installer.kickstart]
          contents = """
          %post
          bootc switch --mutate-in-place --transport registry ${IMAGE_REF}
          %end
          """
          EOF
          sed -i 's/^          //' iso.toml
          cat iso.toml

      - name: Construir a ISO
        id: bib
        uses: osbuild/bootc-image-builder-action@v4
        with:
          builder-image: quay.io/centos-bootc/bootc-image-builder:latest
          config-file: ./iso.toml
          image: ${{ env.IMAGE_REF }}
          types: anaconda-iso

      - name: Enviar ISO
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: iso-${{ matrix.variant }}
          path: ${{ steps.bib.outputs.output-directory }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Link de download no resumo
        run: |
          {
            echo "### ISO (${{ matrix.variant }}) pronta"
            echo ""
            echo "[Baixar iso-${{ matrix.variant }}.zip](${{ steps.upload.outputs.artifact-url }})"
            echo ""
            echo "O download exige login no GitHub. O arquivo expira em 14 dias."
          } >> "$GITHUB_STEP_SUMMARY"
