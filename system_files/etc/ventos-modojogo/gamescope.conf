# Argumentos do gamescope na sessão "Modo Jogo" (sobrescreva em ~/.config/ventos-modojogo/gamescope.conf)
#   --expose-wayland  expõe um socket Wayland aos aplicativos (necessário para o Waydroid; experimental)
#   --adaptive-sync   VRR, se o monitor suportar
#   -w/-h             resolução interna;  -W/-H  resolução de saída
#   -F fsr            reescala com AMD FSR (ajuda a ganhar desempenho em resolução menor)
GAMESCOPE_ARGS="--expose-wayland"
